name: Public mathematical and quality regressions
on:
  push:
    branches: [phase2-math-skill-prototype, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-liberation
      - run: python -m pip install -r requirements.txt
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
      - name: Key-free installation and policy smoke test
        run: |
          python scripts/install_skill.py --destination "$RUNNER_TEMP/skills"
          python "$RUNNER_TEMP/skills/gaokao-platform/scripts/run.py" exam-policy english 2027
          python scripts/math_trends.py
      - name: Release hygiene
        run: python scripts/check_release_hygiene.py
