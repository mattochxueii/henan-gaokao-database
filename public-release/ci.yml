name: Key-free public runtime
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/local_data.py init
      - run: python scripts/install_math_skill.py
      - run: python .agents/skills/henan-math/scripts/run.py research --series project-original --limit 1
      - run: python -m unittest discover -s tests -v
